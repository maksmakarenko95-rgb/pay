<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер QR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a0f;
      --surface: #0d1520;
      --border: #1a2840;
      --accent: #00e5b4;
      --accent2: #0052ff;
      --text: #e8f0fe;
      --muted: #4a6080;
      --danger: #ff4560;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      user-select: none;
    }

    /* фоновые точки */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,229,180,0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* ===== HEADER ===== */
    .header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--accent);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 20px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.active { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: blink 1s ease-in-out infinite; }

    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* ===== SCANNER AREA ===== */
    .scanner-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .scanner-outer {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    canvas#overlay {
      display: none;
    }

    /* угловые рамки */
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      border-color: var(--accent);
      border-style: solid;
      z-index: 2;
    }
    .corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 8px 0 0 0; }
    .corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 8px 0 0; }
    .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 8px; }
    .corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 8px 0; }

    /* линия сканирования */
    .scan-line {
      position: absolute;
      left: 10px; right: 10px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
      animation: scan 2s ease-in-out infinite;
      z-index: 3;
    }
    @keyframes scan {
      0%   { top: 10%;  opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 90%; opacity: 0; }
    }

    /* свечение при обнаружении */
    .scanner-outer.found video {
      box-shadow: 0 0 0 3px var(--accent), 0 0 40px rgba(0,229,180,0.3);
    }

    /* ===== HINT ===== */
    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-top: 16px;
      padding: 0 20px;
    }

    /* ===== RESULT PANEL ===== */
    .result-panel {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .result-panel.show { transform: translateY(0); }

    .result-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 12px;
    }

    .result-title {
      font-family: 'Unbounded', sans-serif;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      color: var(--accent);
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .result-row:last-child { border-bottom: none; }

    .result-label { color: var(--muted); }
    .result-value { color: var(--text); font-weight: 600; text-align: right; max-width: 60%; word-break: break-all; }
    .result-value.accent { color: var(--accent); font-size: 16px; }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: 'Unbounded', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #00b890);
      color: #060a0f;
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* ===== ERROR ===== */
    .error-banner {
      position: fixed;
      bottom: 20px; left: 20px; right: 20px;
      background: rgba(255,69,96,0.15);
      border: 1px solid var(--danger);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--danger);
      text-align: center;
      z-index: 30;
      display: none;
    }

    /* ===== NO CAMERA ===== */
    .no-camera {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 40px;
      width: 100%;
      max-width: 320px;
    }
    .no-camera-icon { font-size: 48px; }
  </style>
</head>
<body>
<div class="app">
  <div class="header" style="display:none"></div>

  <div class="scanner-wrap">
    <div class="scanner-outer" id="scannerOuter">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <div class="no-camera" id="noCamera">
      <div class="no-camera-icon">📷</div>
      <div>Нет доступа к камере</div>
      <div style="font-size:10px;color:#2a3a50">Разреши доступ в настройках браузера</div>
    </div>
  </div>

  <p class="hint" id="hint">Наведи камеру на QR код кассы</p>

  <!-- Панель результата -->
  <div class="result-panel" id="resultPanel">
    <div class="result-icon">✅</div>
    <div class="result-title">QR РАСПОЗНАН</div>

    <div class="result-card">
      <div class="result-row">
        <span class="result-label">МАГАЗИН</span>
        <span class="result-value" id="resMerchant">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">СУММА</span>
        <span class="result-value accent" id="resAmount">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">БАНК</span>
        <span class="result-value" id="resBank">—</span>
      </div>
    </div>



    <div class="btn-group" id="btnGroup">
      <button class="btn btn-secondary" onclick="rescan()">СНОВА</button>
      <button class="btn btn-primary" onclick="sendToBot()">ОТПРАВИТЬ</button>
    </div>
    <div style="height: 40px"></div>
  </div>

  <div class="error-banner" id="errorBanner"></div>
</div>

<script>
  // Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }



  const video    = document.getElementById('video');
  const overlay  = document.getElementById('overlay');
  const ctx      = overlay.getContext('2d');
  const panel    = document.getElementById('resultPanel');
  const outer    = document.getElementById('scannerOuter');
  const hint     = document.getElementById('hint');
  const dot      = document.getElementById('statusDot') || {classList: {add:()=>{}, remove:()=>{}}};
  const statusTxt = document.getElementById('statusText') || {textContent: ''};

  let scanning   = true;
  let scannedData = null;
  let stream     = null;

  // Запуск камеры
  async function startCamera() {
    // Останавливаем предыдущий стрим если есть
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1280 },
          height: { ideal: 1280 },
        },
        audio: false,
      });

      video.setAttribute('playsinline', '');
      video.setAttribute('autoplay', '');
      video.setAttribute('muted', '');
      video.srcObject = stream;

      // iOS требует явного вызова play() после установки srcObject
      await new Promise((resolve, reject) => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(reject);
        };
        video.onerror = reject;
        setTimeout(reject, 5000);  // таймаут 5 сек
      });

      dot.classList.add('active');
      statusTxt.textContent = 'СКАНИРОВАНИЕ';
      requestAnimationFrame(scanFrame);
    } catch (err) {
      console.error('Camera error:', err);
      document.getElementById('noCamera').style.display = 'flex';
      document.querySelector('.scanner-outer').style.display = 'none';
      hint.textContent = 'Разреши доступ к камере и обнови страницу';
    }
  }

  // Сканирование кадров — скрытый canvas только для jsQR, видео живое
  const hiddenCanvas = document.createElement('canvas');
  const hiddenCtx    = hiddenCanvas.getContext('2d');

  function scanFrame() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      hiddenCanvas.width  = video.videoWidth;
      hiddenCanvas.height = video.videoHeight;
      hiddenCtx.drawImage(video, 0, 0);

      const imageData = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });

      if (code) {
        // Проверяем минимальный размер QR (не менее 10% экрана)
        const loc    = code.location;
        const qrW    = Math.abs(loc.topRightCorner.x - loc.topLeftCorner.x);
        const qrH    = Math.abs(loc.bottomLeftCorner.y - loc.topLeftCorner.y);
        const minSize = hiddenCanvas.width * 0.20;

        if (qrW > minSize && qrH > minSize) {
          // Проверяем что это реально СБП QR а не случайный паттерн
          const d = code.data;
          const isSBP = d.includes('qr.nspk.ru') || d.startsWith('ST0') || d.includes('nspk');
          if (isSBP) {
            onQRFound(code.data, code.location);
            return;
          }
        }
      }
    }
    requestAnimationFrame(scanFrame);
  }

  // QR найден
  function onQRFound(data, location) {
    scanning = false;
    outer.classList.add('found');
    dot.classList.remove('active');
    statusTxt.textContent = 'НАЙДЕН';

    // Подсвечиваем QR на canvas
    ctx.strokeStyle = '#00e5b4';
    ctx.lineWidth   = 3;
    ctx.beginPath();
    ctx.moveTo(location.topLeftCorner.x,     location.topLeftCorner.y);
    ctx.lineTo(location.topRightCorner.x,    location.topRightCorner.y);
    ctx.lineTo(location.bottomRightCorner.x, location.bottomRightCorner.y);
    ctx.lineTo(location.bottomLeftCorner.x,  location.bottomLeftCorner.y);
    ctx.closePath();
    ctx.stroke();

    scannedData = data;
    console.log('QR DATA:', data);
    // Показываем сырые данные для отладки
    document.getElementById('resMerchant').textContent = data.substring(0, 30);
    document.getElementById('resAmount').textContent = 'отправить?';
    document.getElementById('resBank').textContent = data.length + ' символов';
    setTimeout(() => panel.classList.add('show'), 100);
  }

  // Парсинг СБП QR
  function parseSBP(qr) {
    let merchant = 'Магазин';
    let amount   = 0;
    let bank     = '—';

    if (qr.includes('qr.nspk.ru')) {
      try {
        const url    = new URL(qr);
        const params = url.searchParams;
        const sum    = params.get('sum');
        amount       = sum ? parseFloat(sum) / 100 : 0;
        merchant     = params.get('name') || 'Магазин';
        bank         = params.get('bank') || '—';
      } catch(e) {}
    } else if (qr.startsWith('ST')) {
      const fields = {};
      qr.split('|').forEach(p => {
        const [k, v] = p.split('=');
        if (k && v) fields[k.trim()] = v.trim();
      });
      amount   = fields['Sum'] ? parseFloat(fields['Sum']) / 100 : 0;
      merchant = fields['Name'] || 'Магазин';
      bank     = fields['BankName'] || fields['BIC'] || '—';
    }

    showResult(merchant, amount, bank);
  }

  function showResult(merchant, amount, bank) {
    document.getElementById('resMerchant').textContent = merchant;
    document.getElementById('resBank').textContent     = bank;
    document.getElementById('resAmount').textContent   = amount > 0 ? amount.toFixed(2) + ' ₽' : 'не указана';
    setTimeout(() => panel.classList.add('show'), 100);
  }

  // Отправка в бот
  function sendToBot() {
    const txt    = document.getElementById('resAmount').textContent;
    const amount = parseFloat(txt.replace(' ₽', '').replace(',', '.')) || 0;

    const payload = JSON.stringify({
      qr:     scannedData,
      amount: amount,   // 0 если нет суммы — бот спросит в чате
    });

    // Пробуем sendData, если не работает — показываем данные для копирования
    if (tg && tg.initData) {
      tg.sendData(payload);
    } else if (tg) {
      // Альтернатива: открываем бота с параметром
      const encoded = encodeURIComponent(JSON.stringify({qr: scannedData, amount: amount}));
      tg.openTelegramLink(`https://t.me/${window._botUsername || 'your_bot'}?start=qr_${encoded}`);
    } else {
      // В браузере — показываем данные
      alert('QR: ' + scannedData + '\nСумма: ' + amount);
      console.log('Payload:', payload);
    }
  }

  // Повторное сканирование
  function rescan() {
    panel.classList.remove('show');
    outer.classList.remove('found');
    scannedData = null;
    scanning    = true;
    startCamera();  // перезапускаем камеру полностью
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent   = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  // Поднимаем панель когда открывается клавиатура
  window.addEventListener('resize', () => {
    const panel = document.getElementById('resultPanel');
    if (panel.classList.contains('show')) {
      panel.scrollIntoView({ behavior: 'smooth' });
      const input = document.getElementById('manualAmount');
      if (input) input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });

  // Старт
  startCamera();
</script>
</body>
</html>
